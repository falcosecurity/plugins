name: Build and test container plugin
on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/container/**"
  push:
    branches: [main]
    paths:
      - "plugins/container/**"
  workflow_dispatch:

permissions:
  packages: read

jobs:
  build-others:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact-name: "libcontainer-win"
            artifact-path: "plugins/container/container.dll"
          - os: macos-latest
            artifact-name: "libcontainer-osx"
            artifact-path: "plugins/container/libcontainer.dylib"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/container/go-worker/go.mod
          cache-dependency-path: plugins/container/go-worker/go.sum

      - name: Build plugin library
        working-directory: plugins/container
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  build-linux:
    name: build-linux-${{ matrix.arch }}
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-22.04-arm') || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: debian:bullseye
    steps:
      - name: Install deps
        run: apt-get update && apt-get install -y --no-install-recommends build-essential zip unzip ninja-build ca-certificates curl git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/container/go-worker/go.mod
          cache-dependency-path: plugins/container/go-worker/go.sum

      - name: Install cmake ⛓️
        uses: ./.github/actions/install-cmake

      - name: Build plugin library
        working-directory: plugins/container
        run: make

      # Issue #1500 shipped because no job both built against an old glibc and
      # loaded the result: this one builds on bullseye but never dlopen'd it,
      # and falco-tests dlopens inside Debian 12 (glibc 2.36), where a missing
      # DT_NEEDED on libresolv cannot fail. This job is already on bullseye
      # (glibc 2.31), so both checks cost nothing but the steps themselves.
      - name: Check libcontainer.so links libresolv
        working-directory: plugins/container
        run: |
          readelf -d libcontainer.so | grep -q 'NEEDED.*libresolv\.so\.2' || {
            echo "libcontainer.so has no DT_NEEDED entry for libresolv.so.2."
            echo "It will fail to load on hosts with glibc < 2.34. See #1500."
            readelf -d libcontainer.so | grep NEEDED
            exit 1
          }

      - name: Load libcontainer.so on glibc < 2.34
        working-directory: plugins/container
        run: |
          cat > /tmp/dlopen_check.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            void *handle = dlopen(argv[1], RTLD_NOW);
            if (!handle) {
              fprintf(stderr, "dlopen failed: %s\n", dlerror());
              return 1;
            }
            return 0;
          }
          EOF
          gcc -o /tmp/dlopen_check /tmp/dlopen_check.c -ldl
          /tmp/dlopen_check ./libcontainer.so
          echo "loaded against $(ldd --version | head -n1)"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libcontainer-${{ matrix.arch }}
          path: "plugins/container/libcontainer.so"

  test:
    name: test-${{ matrix.arch }}
    needs: [build-linux]
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      # libbtrfs: needed by podman package - build dep.
      - name: Install go test deps
        run: sudo apt-get install -y --no-install-recommends libbtrfs-dev

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/container/go-worker/go.mod
          cache-dependency-path: plugins/container/go-worker/go.sum

      - name: Build go-worker executable
        working-directory: plugins/container
        run: make -C go-worker exe

      # The runner image ships /etc/containers/registries.conf in the legacy v1
      # format, which containers/image >= 5.40 rejects outright instead of
      # converting. Rewrite it in v2 form, matching the upstream runner-images
      # fix (actions/runner-images@c7871a91). Can be dropped once that fix
      # reaches the ubuntu-24.04 image.
      - name: Ensure registries.conf is in v2 format
        run: |
          sudo mkdir -p /etc/containers
          printf 'unqualified-search-registries = ["docker.io", "quay.io"]\n' \
            | sudo tee /etc/containers/registries.conf

      - name: Run tests
        working-directory: plugins/container
        run: |
          systemctl --user start podman
          make test

  falco-tests:
    needs: [build-linux]
    name: falco-tests-${{ matrix.arch }}
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-22.04-arm') || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container:
      image: falcosecurity/falco:master-debian
    steps:
      - name: Download library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libcontainer-${{ matrix.arch }}
          path: /usr/share/falco/plugins/

      - name: Run falcosecurity/testing Falco tests
        env:
          # Authenticate to GitHub Container Registry to pull falcoctl image
          # This is a mitigation for the ghcr.io rate limiting issue
          # See https://github.com/falcosecurity/rules/issues/331
          FALCOCTL_REGISTRY_AUTH_BASIC: ghcr.io,${{ github.actor }},${{ github.token }}
        uses: falcosecurity/testing@main
        with:
          test-falco: "true"
          test-falcoctl: "false"
          test-k8saudit: "false"
          test-dummy: "false"
          static: "false"
          test-drivers: "false"
          show-all: "true"
          sudo: ""

  libs-tests:
    needs: [build-linux]
    uses: falcosecurity/libs/.github/workflows/reusable_e2e_tests.yaml@master
    with:
      container_plugin_artifact_name: "libcontainer-amd64"
    secrets: inherit

  formatting-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18

      - name: Run clang-format style check
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/clang-format-check.sh 18 plugins/container llvm 'plugin_config_schema.h'
