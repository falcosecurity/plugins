# This is a reusable workflow used by main and release CI
on:
  workflow_call:
    inputs:
      makecommand:
        description: Command used for make
        required: true
        type: string
      suffix:
        description: Suffix for uploading packages (dev or stable)
        required: true
        type: string

jobs:
  build-packages:
    name: build-packages-${{ matrix.arch }}
    runs-on: ${{ (matrix.arch == 'aarch64' && 'ubuntu-22.04-arm') || 'ubuntu-22.04' }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    # Upgrading to a newer debian version would make the build process generate
    # binaries that require newer GLIBC version so we need to be based on bullseye for now
    container: debian:bullseye
    steps:
      - name: Install deps
        run: |
          apt update
          apt install -y --no-install-recommends awscli build-essential autoconf libelf-dev libtool autotools-dev \
            automake zip unzip ninja-build wget lsb-release software-properties-common gnupg ca-certificates curl git

      - name: Checkout Plugins ⤵️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install updated clang version ⛓️
        run: |
          # Debian 11 reached end of life on August 31st, 2026: the clang-19 binaries were
          # removed from the bullseye-security pool while the index still lists them, so apt
          # gets 404s. Prefer the packages from apt.llvm.org, which are still available.
          printf 'Package: *\nPin: origin apt.llvm.org\nPin-Priority: 1001\n' > /etc/apt/preferences.d/99-apt-llvm-org
          wget https://apt.llvm.org/llvm.sh
          chmod u+x llvm.sh
          ./llvm.sh 19
          ln -s /usr/bin/clang-19 /usr/bin/clang

      - name: Install updated cmake version ⛓️
        uses: ./.github/actions/install-cmake

      - name: Install Rust 🦀
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.88.0"

      - name: Install bpf-linker
        run: |
          cargo install bpf-linker@0.9.14

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 #v2

      - name: Run build 🏗️
        run: ${{ inputs.makecommand }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugins-${{ matrix.arch }}-${{ inputs.suffix }}.tar.gz
          path: output/*.tar.gz
